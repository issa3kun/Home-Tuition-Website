<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMatch | Parent Tutor Request</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page-wrapper">
    <section class="form-card">
      <a href="./index.html" class="back-link">← Back to Home</a>

      <p class="eyebrow">StudyMatch Parent Request</p>
      <h1>Tell us what kind of tutor your child needs.</h1>

      <p class="hero-text">
        Fill in the details below. We will review your request and update you through
        WhatsApp once suitable tutor options are available.
      </p>

      <form id="parentRequestForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="parentName">Parent Name</label>
            <input type="text" id="parentName" required placeholder="e.g. Mrs Tan" />
          </div>

          <div class="form-group">
            <label for="whatsappNumber">WhatsApp Number</label>
            <input type="tel" id="whatsappNumber" required placeholder="e.g. 91234567" />
          </div>

          <div class="form-group">
            <label for="studentLevel">Student Level</label>
            <select id="studentLevel" required>
              <option value="">Select level</option>
              <option>Primary 1</option>
              <option>Primary 2</option>
              <option>Primary 3</option>
              <option>Primary 4</option>
              <option>Primary 5</option>
              <option>Primary 6</option>
              <option>Secondary 1</option>
              <option>Secondary 2</option>
              <option>Secondary 3</option>
              <option>Secondary 4</option>
              <option>JC 1</option>
              <option>JC 2</option>
            </select>
          </div>

          <div class="form-group">
  <label for="subjects">Subject</label>
  <select id="subjects" required>
    <option value="">Select subject</option>

    <optgroup label="Primary School">
      <option>Primary English</option>
      <option>Primary Mathematics</option>
      <option>Primary Science</option>
      <option>Primary Chinese</option>
      <option>Primary Malay</option>
      <option>Primary Tamil</option>
      <option>Primary Higher Chinese</option>
      <option>Primary Higher Malay</option>
      <option>Primary Higher Tamil</option>
    </optgroup>

    <optgroup label="Secondary School - Core Subjects">
      <option>Secondary English</option>
      <option>Secondary Mathematics</option>
      <option>Secondary Additional Mathematics</option>
      <option>Secondary Science</option>
      <option>Secondary Chinese</option>
      <option>Secondary Malay</option>
      <option>Secondary Tamil</option>
      <option>Secondary Higher Chinese</option>
      <option>Secondary Higher Malay</option>
      <option>Secondary Higher Tamil</option>
      <option>Secondary Literature</option>
      <option>Secondary History</option>
      <option>Secondary Geography</option>
      <option>Secondary Social Studies</option>
    </optgroup>

    <optgroup label="Secondary School - Sciences">
      <option>Secondary Biology</option>
      <option>Secondary Chemistry</option>
      <option>Secondary Physics</option>
      <option>Secondary Combined Science (Bio/Chem)</option>
      <option>Secondary Combined Science (Chem/Physics)</option>
      <option>Secondary Combined Science (Physics/Bio)</option>
    </optgroup>

    <optgroup label="Secondary School - Other Subjects">
      <option>Principles of Accounts (POA)</option>
      <option>Design and Technology (D&T)</option>
      <option>Food and Consumer Education (FCE)</option>
      <option>Art</option>
      <option>Music</option>
    </optgroup>

    <optgroup label="Junior College / A-Level">
      <option>JC General Paper (GP)</option>
      <option>JC Project Work</option>
      <option>JC H1 Mathematics</option>
      <option>JC H2 Mathematics</option>
      <option>JC Further Mathematics</option>
      <option>JC H1 Biology</option>
      <option>JC H2 Biology</option>
      <option>JC H1 Chemistry</option>
      <option>JC H2 Chemistry</option>
      <option>JC H1 Physics</option>
      <option>JC H2 Physics</option>
      <option>JC Economics</option>
      <option>JC Literature</option>
      <option>JC History</option>
      <option>JC Geography</option>
      <option>JC China Studies in English</option>
      <option>JC Knowledge and Inquiry</option>
    </optgroup>

    <optgroup label="Others">
      <option>Phonics / Reading</option>
      <option>Creative Writing</option>
      <option>Study Skills / Exam Preparation</option>
      <option>Others</option>
    </optgroup>
  </select>
</div>

          <div class="form-group">
            <label for="lessonMode">Lesson Mode</label>
            <select id="lessonMode" required>
              <option value="">Select mode</option>
              <option>Physical</option>
              <option>Online</option>
              <option>Either</option>
            </select>
          </div>

          <div class="form-group">
            <label for="area">Preferred Area / Location</label>
            <input type="text" id="area" required placeholder="e.g. Tampines" />
          </div>

          <div class="form-group">
            <label for="preferredGender">Preferred Tutor Gender</label>
            <select id="preferredGender">
              <option>No preference</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="form-group">
            <label for="qualification">Preferred Qualification</label>
            <select id="qualification">
              <option>No preference</option>
              <option>Diploma and above</option>
              <option>Undergraduate and above</option>
              <option>Degree holder</option>
              <option>MOE / NIE-trained</option>
            </select>
          </div>

          <div class="form-group">
  <label>Preferred Timing</label>

  <div class="timing-toggle">
    <label class="timing-option">
      <input type="checkbox" name="preferredTimingPeriod" value="AM" />
      <span>AM</span>
    </label>

    <label class="timing-option">
      <input type="checkbox" name="preferredTimingPeriod" value="PM" />
      <span>PM</span>
    </label>
  </div>

  <input
    type="text"
    id="specificTiming"
    class="timing-input"
    placeholder="Optional: e.g. Saturday 10am, weekdays after 7pm"
  />
</div>

          <div class="form-group">
            <label for="budget">Budget per Hour</label>
            <input type="text" id="budget" placeholder="e.g. $35/hr" />
          </div>
        </div>

        <div class="form-group full-width">
          <label for="remarks">Additional Remarks</label>
          <textarea id="remarks" rows="4" placeholder="e.g. Student needs help with problem sums."></textarea>
        </div>

        <button type="submit" class="btn btn-primary full-button">
          Submit Tutor Request
        </button>
      </form>

      <div id="confirmationBox" class="confirmation-box hidden">
        <h2>Request Submitted Successfully</h2>
        <p id="confirmationText"></p>

        <h3>Generated Telegram Job Message</h3>
        <textarea id="telegramMessage" rows="12" readonly></textarea>

        <button id="copyTelegramMessage" class="btn btn-secondary full-button">
          Copy Telegram Message
        </button>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/parent-request.js"></script>
</body>
</html>
