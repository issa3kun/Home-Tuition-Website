<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Tutor Request</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page-wrapper">
    <section class="form-card">
      <a href="index.html" class="back-link">← Back to Home</a>

      <p class="eyebrow">Parent Request Form</p>
      <h1>Tell us what kind of tutor you need.</h1>

      <p class="hero-text">
        Fill in the details below. We will use this information to find suitable tutors
        and follow up with you through WhatsApp.
      </p>

      <form id="parentRequestForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="parentName">Parent Name</label>
            <input type="text" id="parentName" required placeholder="e.g. Mrs Tan" />
          </div>

          <div class="form-group">
            <label for="whatsappNumber">WhatsApp Number</label>
            <input type="tel" id="whatsappNumber" required placeholder="e.g. 91234567" />
          </div>

          <div class="form-group">
            <label for="studentLevel">Student Level</label>
            <select id="studentLevel" required>
              <option value="">Select level</option>
              <option>Primary 1</option>
              <option>Primary 2</option>
              <option>Primary 3</option>
              <option>Primary 4</option>
              <option>Primary 5</option>
              <option>Primary 6</option>
              <option>Secondary 1</option>
              <option>Secondary 2</option>
              <option>Secondary 3</option>
              <option>Secondary 4</option>
              <option>JC 1</option>
              <option>JC 2</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subjects">Subject(s)</label>
            <input type="text" id="subjects" required placeholder="e.g. Math, Science" />
          </div>

          <div class="form-group">
            <label for="lessonMode">Lesson Mode</label>
            <select id="lessonMode" required>
              <option value="">Select mode</option>
              <option>Physical</option>
              <option>Online</option>
              <option>Either</option>
            </select>
          </div>

          <div class="form-group">
            <label for="area">Preferred Area / Location</label>
            <input type="text" id="area" required placeholder="e.g. Tampines" />
          </div>

          <div class="form-group">
            <label for="preferredGender">Preferred Tutor Gender</label>
            <select id="preferredGender">
              <option>No preference</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="form-group">
            <label for="qualification">Preferred Qualification</label>
            <select id="qualification">
              <option>No preference</option>
              <option>Diploma and above</option>
              <option>Undergraduate and above</option>
              <option>Degree holder</option>
              <option>MOE / NIE-trained</option>
            </select>
          </div>

          <div class="form-group">
            <label for="preferredTiming">Preferred Timing</label>
            <input type="text" id="preferredTiming" placeholder="e.g. Saturday morning" />
          </div>

          <div class="form-group">
            <label for="budget">Budget per Hour</label>
            <input type="text" id="budget" placeholder="e.g. $35/hr" />
          </div>
        </div>

        <div class="form-group full-width">
          <label for="remarks">Additional Remarks</label>
          <textarea id="remarks" rows="4" placeholder="e.g. Student needs help with problem sums."></textarea>
        </div>

        <button type="submit" class="btn btn-primary full-button">
          Submit Tutor Request
        </button>
      </form>

      <div id="confirmationBox" class="confirmation-box hidden">
        <h2>Request Submitted Successfully</h2>
        <p id="confirmationText"></p>

        <h3>Generated Telegram Job Message</h3>
        <textarea id="telegramMessage" rows="12" readonly></textarea>

        <button id="copyTelegramMessage" class="btn btn-secondary full-button">
          Copy Telegram Message
        </button>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/parent-request.js"></script>
</body>
</html>
